name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test-hermetic:
    strategy:
      # One platform failing must not cancel the other; the Windows leg is
      # the one that actually gates the product.
      fail-fast: false
      matrix:
        include:
          # Full workspace. Every crate here talks to WMI, PowerShell Direct,
          # or cdb.exe, so this leg can only run on Windows.
          - os: windows-latest
            packages: ""
          # Portability guard: hvlab-core and hvlab-dump are pure Rust (no
          # `wmi`, no `windows-sys`, no platform APIs), so they must build
          # and test anywhere. The rest of the workspace is Windows-only by
          # construction and would fail here for reasons that are not bugs.
          - os: ubuntu-latest
            packages: "-p hvlab-core -p hvlab-dump"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-nextest --locked
      - run: cargo nextest run --all-features --locked ${{ matrix.packages }}
      - run: cargo test --doc --locked ${{ matrix.packages }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # advisories + licenses + bans; a deny.toml ships with the repo
          command: check all

  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
