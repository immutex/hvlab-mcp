<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="hvlab">
  <!-- A virtual machine (frame + terminal prompt) above a stack of
       checkpoints. Explicit colour rather than currentColor: an <img>
       reference has no CSS context, so currentColor would render black
       and vanish on a dark theme. #6b5bd2 reads on both. -->
  <g fill="none" stroke="#6b5bd2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="12" width="76" height="54" rx="8" stroke-width="6"/>
    <path d="M10 27h76" stroke-width="5"/>
    <path d="M25 39l10 9-10 9" stroke-width="6"/>
    <path d="M43 57h20" stroke-width="6"/>
    <path d="M27 78h42" stroke-width="6" opacity="0.75"/>
    <path d="M36 89h24" stroke-width="6" opacity="0.45"/>
  </g>
</svg>
